
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="game-page">

    <main class="game-card">

        <div class="eyebrow">✦ MINI GAME ✦</div>

        <div class="game-icon">🎯</div>

        <h1>Guess the Number</h1>

        <p class="subtitle">
            I'm thinking of a number between
            <strong>1 and 100</strong>.
        </p>

        <div class="attempt-panel">
            <span class="attempt-label">ATTEMPTS LEFT</span>
            <strong id="attemptsLeft">5</strong>
            <div class="attempt-dots" id="attemptDots">
                <span class="dot active"></span>
                <span class="dot active"></span>
                <span class="dot active"></span>
                <span class="dot active"></span>
                <span class="dot active"></span>
            </div>
        </div>

        <form id="guessForm" class="guess-form">

            <label for="guessInput">YOUR GUESS</label>

            <div class="input-row">

                <input
                    id="guessInput"
                    type="number"
                    min="1"
                    max="100"
                    placeholder="Enter a number"
                    required
                >

                <button id="guessButton" type="submit">
                    Guess →
                </button>

            </div>

        </form>

        <div id="message" class="message">
            💡 Make your first guess. Good luck!
        </div>

        <div class="game-footer">

            <span>✧ You have 5 chances</span>

            <button id="restartButton" type="button">
                ↻ New Game
            </button>

        </div>

    </main>

    <p class="page-note">
        THINK SMART. GUESS RIGHT. HAVE FUN.
    </p>

    <script src="guess.js"></script>

</body>
</html>
